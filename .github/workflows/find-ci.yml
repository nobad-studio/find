name: NOBAD Find tests

# Unit tests and pyflakes on Windows (the app uses DPAPI, SQLCipher and Windows APIs), with the hash-pinned
# dependencies, then the installer build. Runs on every pull request; the ruleset requires "find-tests" and
# "find-build".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: find-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: find-tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pinned dependencies (hash-checked)
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: pyflakes
        run: python -m pyflakes nobadfind tests

  build:
    # Builds the per-user installer (packaging/build.ps1: fresh venv, hash-pinned dependencies, tests, the Flutter UI's
    # tests and release build, PyInstaller, Inno Setup) and keeps it as a workflow artifact. Nothing is published here.
    name: find-build
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the Flutter SDK (3.50.0, checked by commit; no third-party action)
        shell: pwsh
        run: |
          # The org requires every action pinned to a commit, including the ones an action uses inside
          # (subosito/flutter-action pulls actions/cache by tag), so Flutter comes straight from its repo.
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --quiet --branch 3.50.0 --depth 1 https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE) { throw 'cloning Flutter failed' }
          $rev = git -C $sdk rev-parse HEAD
          if ($rev -ne 'ab2912035e160d9cad6306df307576da6128ebdb') { throw "Flutter 3.50.0 is $rev, not the pinned commit" }
          Join-Path $sdk 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $sdk 'bin\flutter.bat') config --no-analytics
          & (Join-Path $sdk 'bin\flutter.bat') --version
          if ($LASTEXITCODE) { throw 'flutter --version failed' }

      - name: Install Inno Setup (pinned)
        run: choco install innosetup --version 6.7.1 --no-progress -y

      - name: Build (tests, app, installer)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nobad-find-installer
          path: dist-installer/*
          retention-days: 14
          if-no-files-found: error
